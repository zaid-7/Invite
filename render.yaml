services:
  - type: web
    name: invitecraft-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build && npm run prisma:migrate:deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Comma-separated list if serving both apex and www domains
      - key: FRONTEND_URL
        value: https://invitescraft.live,https://www.invitescraft.live
      - key: BACKEND_URL
        value: https://api.invitescraft.live
      - key: PREVIEW_TTL_MINUTES
        value: '30'
      - key: PREVIEW_MAX_VIEWS
        value: '10'
      - key: OTP_TTL_SECONDS
        value: '300'
      - key: OTP_LENGTH
        value: '6'
